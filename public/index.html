<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAI Slides Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Mono&family=Fira+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="template/cai-slides.css">
<link rel="stylesheet" href="editor.css">
</head>
<body class="ed">

<header class="topbar">
  <div class="brand"><img src="figures/cai_logo_small_light.svg" alt=""><span>Slides</span></div>
  <div class="tgroup">
    <select id="deckSel" title="切换演示文稿"></select>
    <button class="tb" id="newDeck" title="新建演示文稿">新建</button>
    <div class="menu">
      <button class="tb" data-menu title="导入已有项目">导入 ▾</button>
      <div class="menu-pop">
        <button data-import="files">从文件导入（ZIP / HTML / JSON）…</button>
        <button data-import="folder">从文件夹导入…</button>
      </div>
    </div>
  </div>
  <div class="sep"></div>
  <div class="tgroup">
    <button class="tb" data-cmd="addText" data-insert title="插入文本框">＋ 文本</button>
    <div class="menu">
      <button class="tb" data-menu data-insert title="插入图片">＋ 图片 ▾</button>
      <div class="menu-pop">
        <button data-cmd="addImage">从文件上传…</button>
        <button data-cmd="addImageUrl">使用网址…</button>
      </div>
    </div>
    <div class="menu">
      <button class="tb" data-menu data-insert title="插入视频">＋ 视频 ▾</button>
      <div class="menu-pop">
        <button data-cmd="addVideo">从文件上传…</button>
        <button data-cmd="addVideoUrl">使用网址…</button>
      </div>
    </div>
  </div>
  <div class="sep"></div>
  <div class="tgroup fmt" id="fmt">
    <button class="tb ic" data-exec="bold" title="加粗 (⌘B)"><b>B</b></button>
    <button class="tb ic" data-exec="italic" title="斜体 (⌘I)"><i>I</i></button>
    <button class="tb ic" data-exec="underline" title="下划线 (⌘U)"><u>U</u></button>
    <button class="tb ic" data-exec="insertUnorderedList" title="项目符号列表">•≡</button>
    <button class="tb ic" data-exec="insertOrderedList" title="编号列表">1≡</button>
    <button class="tb ic" data-exec="outdent" title="减少缩进 (⇧Tab)">⇤</button>
    <button class="tb ic" data-exec="indent" title="增加缩进 (Tab)">⇥</button>
    <button class="tb ic" data-exec="createLink" title="插入链接">🔗</button>
    <button class="tb ic" data-exec="removeFormat" title="清除格式">T̸</button>
  </div>
  <div class="sep"></div>
  <div class="tgroup">
    <button class="tb ic" id="undoBtn" title="撤销 (⌘Z)">↶</button>
    <button class="tb ic" id="redoBtn" title="重做 (⇧⌘Z)">↷</button>
  </div>
  <div class="spacer"></div>
  <span id="status" class="status"></span>
  <span id="modeBadge" class="mode-badge" hidden title="未连接服务器：内容保存在此浏览器中。换电脑或清除网站数据前，请导出 ZIP 备份。">浏览器存储</span>
  <div class="menu" id="langMenu">
    <button class="tb lang" data-menu title="切换语言"><span id="langLabel"></span> ▾</button>
    <div class="menu-pop right">
      <button data-lang="en"><span class="check"></span>English</button>
      <button data-lang="zh"><span class="check"></span>简体中文</button>
    </div>
  </div>
  <button class="tb" id="previewBtn" title="在新标签页中播放">▶ 预览</button>
  <div class="menu">
    <button class="tb primary" data-menu>导出 ▾</button>
    <div class="menu-pop right">
      <button data-export="zip">下载 ZIP（可再次导入）</button>
      <button data-export="single">下载单文件 HTML（媒体内嵌）</button>
      <button data-export="folder" hidden>导出为文件夹（exports/）</button>
    </div>
  </div>
</header>

<div class="main">
  <aside class="sidebar">
    <div class="side-head">
      <span>幻灯片</span>
      <div class="menu">
        <button class="tb small" data-menu>＋ 新建页 ▾</button>
        <div class="menu-pop">
          <button data-add-slide="title">标题页</button>
          <button data-add-slide="section">章节页</button>
          <button data-add-slide="subsection">小节页</button>
          <button data-add-slide="content">内容页</button>
          <button data-add-slide="standout">感谢页</button>
        </div>
      </div>
    </div>
    <div id="thumbs" class="thumbs"></div>
  </aside>

  <section class="canvas-area" id="canvasArea">
    <div class="stage" id="stage"></div>
    <div class="canvas-note" id="canvasNote"></div>
    <div class="drop-hint">松开以插入图片 / 视频</div>
  </section>

  <aside class="panel" id="panel"></aside>
</div>

<input type="file" id="fileInput" hidden multiple>
<div id="toast" class="toast"></div>

<script src="template/cai-slides.js"></script>
<script src="shared/render.js"></script>
<script src="store.js"></script>
<script src="io.js"></script>
<script src="i18n.js"></script>
<script src="editor.js"></script>
</body>
</html>
